services:
  postgres:
    image: postgres:15-alpine
    container_name: yandeh-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-yandeh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yandeh}
      POSTGRES_DB: ${POSTGRES_DB:-yandeh_marketplace}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-yandeh}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: yandeh-backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-yandeh}:${POSTGRES_PASSWORD:-yandeh}@postgres:5432/${POSTGRES_DB:-yandeh_marketplace}
      PORT: 3000
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: yandeh-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend

volumes:
  postgres_data:
