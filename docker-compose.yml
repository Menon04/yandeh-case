services:
  postgres:
    image: postgres:15-alpine
    container_name: yandeh-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-yandeh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yandeh}
      POSTGRES_DB: ${POSTGRES_DB:-yandeh_marketplace}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-yandeh}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
